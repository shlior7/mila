<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mila Transcribe</title>
<style>
  :root { --bg: #fafaf9; --fg: #1c1917; --muted: #78716c; --card: #fff; --line: #e7e5e4; --accent: #dc2626; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1c1917; --fg: #f5f5f4; --muted: #a8a29e; --card: #292524; --line: #44403c; --accent: #dc2626; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 -apple-system, system-ui, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  p.sub { color: var(--muted); margin: 0 0 24px; }
  form { display: grid; gap: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  input[type=file] { flex: 1; min-width: 0; }
  select, button { font: inherit; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--fg); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button:disabled { opacity: .5; }
  #status { color: var(--muted); min-height: 1.5em; margin: 16px 0 8px; }
  #result { display: none; }
  #text { white-space: pre-wrap; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-top: 12px; }
</style>
</head>
<body>
<main>
  <h1>Mila Transcribe</h1>
  <p class="sub">Record, or upload an audio or video file. Hebrew uses the ivrit.ai model.</p>
  <form id="form">
    <div class="row">
      <button class="primary" id="record" type="button">● Record</button>
      <span id="recording"></span>
    </div>
    <input id="file" type="file" accept="audio/*,video/*">
    <div class="row">
      <select id="language">
        <option value="he">Hebrew</option>
        <option value="en">English</option>
        <option value="auto">Detect language</option>
      </select>
      <button class="primary" id="go" type="submit">Transcribe</button>
    </div>
  </form>
  <div id="status"></div>
  <section id="result">
    <div class="row">
      <button id="copy" type="button">Copy</button>
      <button id="txt" type="button">Download .txt</button>
      <button id="srt" type="button">Download .srt</button>
    </div>
    <div id="text" dir="auto"></div>
  </section>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  let last = null, name = "transcript";

  $("form").addEventListener("submit", (event) => {
    event.preventDefault();
    if ($("file").files[0]) transcribe($("file").files[0]);
  });

  // Safari stops recording when the screen locks or the tab is left: keep it open.
  let recorder = null;
  $("record").onclick = async () => {
    if (recorder) { recorder.stop(); return; }
    let stream;
    try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
    catch (error) { $("status").textContent = `No microphone: ${error.message}`; return; }
    const chunks = [], started = Date.now();
    recorder = new MediaRecorder(stream);
    recorder.ondataavailable = (e) => chunks.push(e.data);
    const tick = setInterval(() => {
      const s = Math.round((Date.now() - started) / 1000);
      $("recording").textContent = `Recording ${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
    }, 1000);
    recorder.onstop = () => {
      clearInterval(tick);
      stream.getTracks().forEach((t) => t.stop());
      const type = recorder.mimeType || "audio/mp4";
      recorder = null;
      $("record").textContent = "● Record";
      $("recording").textContent = "";
      const ext = type.includes("webm") ? "webm" : type.includes("ogg") ? "ogg" : "m4a";
      const when = new Date().toISOString().slice(0, 16).replace("T", " ").replace(":", "-");
      transcribe(new File(chunks, `Recording ${when}.${ext}`, { type }));
    };
    recorder.start(1000);
    $("record").textContent = "■ Stop";
  };

  async function transcribe(file) {
    name = file.name.replace(/\.[^.]+$/, "");
    const body = new FormData();
    body.append("file", file);
    body.append("language", $("language").value);
    $("go").disabled = true;
    $("result").style.display = "none";
    const started = Date.now();
    const tick = setInterval(() => {
      const s = Math.round((Date.now() - started) / 1000);
      $("status").textContent = `Transcribing… ${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")} (the first run after a pause adds about a minute)`;
    }, 1000);
    try {
      const response = await fetch("web/transcribe", { method: "POST", body });
      if (!response.ok) throw new Error(`${response.status}: ${(await response.text()).slice(0, 200)}`);
      last = await response.json();
      $("text").textContent = last.text || "(nothing was said)";
      $("result").style.display = "block";
      $("status").textContent = `Done: ${Math.round(last.duration / 60)} min of audio in ${Math.round((Date.now() - started) / 1000)} s.`;
    } catch (error) {
      $("status").textContent = `Failed: ${error.message}`;
    } finally {
      clearInterval(tick);
      $("go").disabled = false;
    }
  }

  function save(text, ext) {
    const link = document.createElement("a");
    link.href = URL.createObjectURL(new Blob([text], { type: "text/plain;charset=utf-8" }));
    link.download = `${name}.${ext}`;
    link.click();
    URL.revokeObjectURL(link.href);
  }
  function stamp(t) {
    const ms = Math.round(t * 1000), h = Math.floor(ms / 3600000), m = Math.floor(ms / 60000) % 60;
    const s = Math.floor(ms / 1000) % 60, r = ms % 1000, p = (n, w = 2) => String(n).padStart(w, "0");
    return `${p(h)}:${p(m)}:${p(s)},${p(r, 3)}`;
  }
  $("copy").onclick = () => navigator.clipboard.writeText(last.text);
  $("txt").onclick = () => save(last.text, "txt");
  $("srt").onclick = () => save(last.segments.map((s, i) =>
    `${i + 1}\n${stamp(s.start)} --> ${stamp(s.end)}\n${s.text.trim()}\n`).join("\n"), "srt");
</script>
</body>
</html>
